plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

sourceSets {
    c1Testmod {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    optionalDependencyTestmod {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    c1TestmodImplementation.extendsFrom implementation
    c1TestmodCompileOnly.extendsFrom compileOnly
    c1TestmodRuntimeOnly.extendsFrom runtimeOnly
    optionalDependencyTestmodImplementation.extendsFrom implementation
    optionalDependencyTestmodCompileOnly.extendsFrom compileOnly
    optionalDependencyTestmodRuntimeOnly.extendsFrom runtimeOnly
}

loom {
    mods {
        "visual-keymap" {
            sourceSet sourceSets.main
        }
        "visual-keymap-c1-test" {
            sourceSet sourceSets.c1Testmod
        }
        "visual-keymap-optional-dependency-test" {
            sourceSet sourceSets.optionalDependencyTestmod
        }
    }

    runs {
        client {
            runDir = "runs/mc-26.3-b2.5"
        }
        c1IntegrationClient {
            client()
            displayName = "Visual Keymap C1 Integration Client"
            sourceSet = sourceSets.c1Testmod.name
            runDirectory = file("runs/mc-26.3-c1")
            systemProperties.put("visualkeymap.c1.stage", providers.gradleProperty("c1Stage").orElse("apply"))
            systemProperties.put("visualkeymap.c1.snapshot", providers.gradleProperty("c1Snapshot").orElse(
                    file("test-fixtures/porting-26.3/snapshots/real-26.2-malilib-v1.json").absolutePath
            ))
            generateRunConfig = false
        }
        noMaLiLibClient {
            client()
            displayName = "Visual Keymap Client without MaLiLib"
            sourceSet = sourceSets.optionalDependencyTestmod.name
            runDirectory = file("runs/mc-26.3-c1-no-malilib")
            generateRunConfig = false
        }
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name + '-' + project.minecraft_version
}


repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven { url = "https://jitpack.io" }
    maven {url = "https://masa.dy.fi/maven/sakura-ryoko" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven {url = "https://maven.fallenbreath.me/releases" }
    maven { url = "https://api.modrinth.com/maven" }
    exclusiveContent {
        forRepository {
            maven { url = "https://cursemaven.com" }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly "maven.modrinth:malilib:${project.malilib_version}"
    compileOnly "curse.maven:commandkeys-873388:${project.commandkeys_curse_file_id}"
    compileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"

    if (!providers.gradleProperty("excludeMaLiLibRuntime").isPresent()) {
        runtimeOnly "maven.modrinth:malilib:${project.malilib_version}"
        // C1 development runtime provider; runtimeOnly keeps it out of the published mod JAR.
        runtimeOnly "maven.modrinth:tweakeroo:${project.tweakeroo_test_version}"
    }
    runtimeOnly "curse.maven:commandkeys-873388:${project.commandkeys_curse_file_id}"
    runtimeOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"

    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testCompileOnly "maven.modrinth:malilib:${project.malilib_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

tasks.named("test") {
    useJUnitPlatform()
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}
